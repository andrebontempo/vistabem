<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <radialGradient id="catFemBg" cx="55%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#351C52"/>
      <stop offset="55%" stop-color="#211133"/>
      <stop offset="100%" stop-color="#140A20"/>
    </radialGradient>
    <linearGradient id="silkFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6DCF2"/>
      <stop offset="45%" stop-color="#9A78C2"/>
      <stop offset="85%" stop-color="#4A2570"/>
      <stop offset="100%" stop-color="#28133D"/>
    </linearGradient>
    <linearGradient id="goldBelt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B68D40"/>
      <stop offset="50%" stop-color="#E5CA93"/>
      <stop offset="100%" stop-color="#B68D40"/>
    </linearGradient>
    <filter id="shadowFem" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#09040E" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Fundo Editorial Sóbrio -->
  <rect width="800" height="800" fill="url(#catFemBg)"/>

  <!-- Arco Arquitetônico Clássico de Fundo -->
  <path d="M 220,760 L 220,300 C 220,160 320,80 440,80 C 560,80 660,160 660,300 L 660,760" stroke="#C5A059" stroke-width="1.2" stroke-opacity="0.3" fill="rgba(255, 255, 255, 0.02)"/>
  <circle cx="440" cy="340" r="210" fill="#C5A059" fill-opacity="0.06"/>

  <!-- SILHUETA EDITORIAL FEMININA BEM ENQUADRADA -->
  <g filter="url(#shadowFem)" transform="translate(150, 30)">
    <!-- Chapéu de Alfaiataria -->
    <ellipse cx="290" cy="135" rx="125" ry="22" fill="#1A0D29" stroke="#C5A059" stroke-width="2"/>
    <path d="M 235,130 C 230,82 350,82 345,130" fill="#2A1542" stroke="#D4B475" stroke-width="1.6"/>

    <!-- Linha do Rosto e Cabelo -->
    <path d="M 290,145 C 270,175 260,210 250,248 C 265,258 295,240 305,220" stroke="#FAF8F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 305,145 C 325,178 330,228 340,265" stroke="#DFD3EE" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Brinco Clássico Pérola & Ouro -->
    <circle cx="265" cy="208" r="4" fill="#D4B475"/>
    <line x1="265" y1="212" x2="265" y2="232" stroke="#D4B475" stroke-width="1.8"/>
    <circle cx="265" cy="235" r="4.5" fill="#FAF8F5"/>

    <!-- Vestido Midi/Longo de Alfaiataria Fluida -->
    <path d="M 238,232 Q 290,260 342,232 L 336,325 Q 290,338 244,325 Z" fill="url(#silkFlow)"/>
    
    <!-- Cinto Fino Dourado Champanhe -->
    <path d="M 244,325 Q 290,338 336,325" stroke="url(#goldBelt)" stroke-width="5" stroke-linecap="round"/>
    <rect x="281" y="322" width="18" height="15" rx="3" fill="#1A0D29" stroke="#D4B475" stroke-width="2"/>

    <!-- Saia Evasê Fluida -->
    <path d="M 244,330 C 234,420 180,545 135,675 C 225,698 395,698 465,675 C 425,545 346,420 336,330 Z" fill="url(#silkFlow)"/>

    <!-- Pregas de Caimento -->
    <path d="M 254,335 C 244,435 205,555 178,680" stroke="#FAF8F5" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>
    <path d="M 285,340 C 285,445 270,565 256,685" stroke="#231138" stroke-width="3" stroke-linecap="round"/>
    <path d="M 312,340 C 322,445 340,565 354,685" stroke="#FAF8F5" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- Detalhe de Fenda Discreta em Dourado -->
    <path d="M 318,465 L 372,682" stroke="#D4B475" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="740" y="755" font-family="'Bodoni Moda', Georgia, serif" font-size="22" font-weight="600" fill="rgba(250, 248, 245, 0.2)" letter-spacing="6" text-anchor="end">ATELIER FEMININO</text>
</svg>
