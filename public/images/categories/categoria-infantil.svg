<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <radialGradient id="catKidsBg" cx="65%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#361E52"/>
      <stop offset="55%" stop-color="#201132"/>
      <stop offset="100%" stop-color="#130A1E"/>
    </radialGradient>
    <linearGradient id="kidsDressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#E6DCF2"/>
      <stop offset="100%" stop-color="#B89CE0"/>
    </linearGradient>
    <filter id="kidsShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#09040E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#catKidsBg)"/>

  <!-- Aura Suave Lavanda & Dourado Champanhe -->
  <circle cx="415" cy="210" r="145" fill="#D4B475" fill-opacity="0.07"/>
  <circle cx="415" cy="210" r="132" stroke="#D4B475" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Estrelinhas Delicadas em Ouro Champanhe -->
  <path d="M 330 95 L 332 101 L 338 103 L 332 105 L 330 111 L 328 105 L 322 103 L 328 101 Z" fill="#D4B475" fill-opacity="0.75"/>
  <path d="M 515 125 L 517 130 L 522 132 L 517 134 L 515 139 L 513 134 L 508 132 L 513 130 Z" fill="#E6DCF2" fill-opacity="0.7"/>

  <!-- SILHUETA INFANTIL CENTRALIZADA E PROPORCIONAL -->
  <g filter="url(#kidsShadow)" transform="translate(215, 22) scale(0.88)">
    <!-- Cabide Infantil em Dourado Champanhe -->
    <path d="M 230,75 C 230,65 240,60 240,70 C 240,80 230,82 230,92" stroke="#D4B475" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 162,120 L 230,92 L 298,120" stroke="#D4B475" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Ombros com Babado Suave -->
    <path d="M 162,125 C 147,135 142,155 157,165 C 167,160 172,145 177,130 Z" fill="#FAF8F5"/>
    <path d="M 298,125 C 313,135 318,155 303,165 C 293,160 288,145 283,130 Z" fill="#FAF8F5"/>

    <!-- Corpo do Vestidinho Rodado -->
    <path d="M 175,125 L 180,200 C 180,200 142,305 122,335 C 172,350 288,350 338,335 C 318,305 280,200 280,200 L 285,125 Z" fill="url(#kidsDressGrad)"/>

    <!-- Decote com Lacinho Dourado Champanhe -->
    <path d="M 200,125 Q 230,145 260,125" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 230,142 L 218,135 L 221,147 Z" fill="#C5A059"/>
    <path d="M 230,142 L 242,135 L 239,147 Z" fill="#C5A059"/>
    <circle cx="230" cy="142" r="2.8" fill="#FAF8F5"/>

    <!-- Pregas Delicadas -->
    <path d="M 192,205 C 186,250 168,295 154,340" stroke="#FAF8F5" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 230,205 C 230,255 230,300 230,344" stroke="#6E4499" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M 268,205 C 274,250 292,295 306,340" stroke="#FAF8F5" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Barra Bordada em Dourado Champanhe -->
    <path d="M 122,335 Q 142,346 162,335 Q 182,346 202,335 Q 222,346 242,335 Q 262,346 282,335 Q 302,346 322,335 Q 330,342 338,335" stroke="#C5A059" stroke-width="2.2" fill="none"/>
  </g>

  <text x="565" y="422" font-family="'Bodoni Moda', Georgia, serif" font-size="18" font-weight="600" fill="rgba(250, 248, 245, 0.2)" letter-spacing="5" text-anchor="end">LINHA PETIT</text>
</svg>
