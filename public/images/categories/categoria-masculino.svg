<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <radialGradient id="catMascBg" cx="65%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2E1A47"/>
      <stop offset="55%" stop-color="#1C102B"/>
      <stop offset="100%" stop-color="#120A1C"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F2460"/>
      <stop offset="50%" stop-color="#26153B"/>
      <stop offset="100%" stop-color="#160C24"/>
    </linearGradient>
    <filter id="mascShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08030D" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#catMascBg)"/>

  <!-- Moldura Geométrica Sóbria de Alfaiataria -->
  <circle cx="410" cy="215" r="145" fill="#C5A059" fill-opacity="0.06"/>
  <circle cx="410" cy="215" r="135" stroke="#C5A059" stroke-width="1" stroke-opacity="0.25"/>

  <!-- SILHUETA MASCULINA: ALFAIATARIA BEM ENQUADRADA (Escala 0.82 para nunca cortar no mobile/desktop) -->
  <g filter="url(#mascShadow)" transform="translate(215, 32) scale(0.84)">
    <!-- Cabide de Madeira & Latão Dourado -->
    <path d="M 235,28 C 235,16 248,14 248,24 C 248,32 238,35 238,44" stroke="#D4B475" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 165,92 L 238,44 L 315,92" stroke="#9E7B3B" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Colarinho e Camisa Off-White -->
    <polygon points="212,85 240,138 268,85" fill="#FAF8F5"/>
    <!-- Gravata Sóbria em Seda Champanhe -->
    <polygon points="236,112 244,112 246,205 240,220 234,205" fill="#C5A059"/>

    <!-- Blazer Alfaiataria Masculino -->
    <!-- Ombro e Manga Esquerda -->
    <path d="M 160,102 L 132,165 L 146,375 L 190,366 L 195,195" fill="url(#suitGrad)"/>
    <!-- Ombro e Manga Direita -->
    <path d="M 320,102 L 348,165 L 334,375 L 290,366 L 285,195" fill="url(#suitGrad)"/>

    <!-- Corpo do Blazer -->
    <path d="M 180,105 L 180,395 C 210,410 270,410 300,395 L 300,105 Z" fill="url(#suitGrad)" stroke="#4E2F75" stroke-width="1"/>

    <!-- Lapelas Estruturadas com Pesponto Dourado Sutil -->
    <path d="M 196,105 L 210,185 L 186,215 L 238,290 L 238,395" stroke="#D4B475" stroke-width="1.8" fill="none"/>
    <path d="M 284,105 L 270,185 L 294,215 L 242,290 L 242,395" stroke="#9A78C2" stroke-width="1.6" fill="none"/>

    <!-- Lenço de Bolso (Pocket Square) Marfim & Ouro -->
    <polygon points="190,192 204,178 214,192" fill="#FAF8F5"/>
    <line x1="186" y1="194" x2="218" y2="194" stroke="#D4B475" stroke-width="2"/>

    <!-- Botões Clássicos -->
    <circle cx="240" cy="315" r="4.5" fill="#1A0D29" stroke="#D4B475" stroke-width="1.5"/>
    <circle cx="240" cy="350" r="4.5" fill="#1A0D29" stroke="#D4B475" stroke-width="1.5"/>
  </g>

  <text x="565" y="422" font-family="'Bodoni Moda', Georgia, serif" font-size="18" font-weight="600" fill="rgba(250, 248, 245, 0.2)" letter-spacing="5" text-anchor="end">ALFAIATARIA</text>
</svg>
