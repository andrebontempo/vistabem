<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <radialGradient id="catAcessBg" cx="65%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#321B4D"/>
      <stop offset="55%" stop-color="#1E1030"/>
      <stop offset="100%" stop-color="#12091D"/>
    </radialGradient>
    <linearGradient id="bagLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#432368"/>
      <stop offset="50%" stop-color="#281440"/>
      <stop offset="100%" stop-color="#170B26"/>
    </linearGradient>
    <linearGradient id="metalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E3B8"/>
      <stop offset="45%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6B2F"/>
    </linearGradient>
    <filter id="acessShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#08030D" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#catAcessBg)"/>

  <!-- Moldura Circular Sóbria -->
  <circle cx="530" cy="200" r="155" fill="#C5A059" fill-opacity="0.06"/>
  <circle cx="530" cy="200" r="142" stroke="#C5A059" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Sombra de Pedestal -->
  <ellipse cx="530" cy="348" rx="165" ry="16" fill="#09040E" fill-opacity="0.55"/>

  <!-- COMPOSIÇÃO DE ACESSÓRIOS DE LUXO CENTRALIZADA (sem cortes no mobile) -->
  <!-- 1. BOLSA BAGUETTE DE COURO E FERRAGENS DOURADAS -->
  <g filter="url(#acessShadow)" transform="translate(310, 28) scale(0.92)">
    <!-- Alça em Corrente Dourado Champanhe -->
    <path d="M 120,180 C 120,60 300,60 300,180" stroke="url(#metalGold)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M 120,180 C 120,60 300,60 300,180" stroke="#FAF8F5" stroke-width="1.4" stroke-dasharray="6 8" stroke-linecap="round" fill="none" stroke-opacity="0.7"/>

    <!-- Fixadores da Alça -->
    <circle cx="120" cy="185" r="9" fill="#170B26" stroke="url(#metalGold)" stroke-width="2.8"/>
    <circle cx="300" cy="185" r="9" fill="#170B26" stroke="url(#metalGold)" stroke-width="2.8"/>

    <!-- Corpo da Bolsa Baguette -->
    <path d="M 105,190 C 100,280 130,320 210,320 C 290,320 320,280 315,190 Z" fill="url(#bagLeather)"/>
    <path d="M 112,195 C 108,270 135,310 210,310 C 285,310 312,270 308,195" stroke="#D4B475" stroke-width="1.2" stroke-dasharray="4 4" fill="none" stroke-opacity="0.6"/>

    <!-- Aba Frontal da Bolsa -->
    <path d="M 104,188 C 150,195 270,195 316,188 L 305,250 C 260,270 160,270 115,250 Z" fill="#2E1649" stroke="#522B78" stroke-width="1.5"/>

    <!-- Fecho Monograma em Ouro Champanhe -->
    <rect x="190" y="235" width="40" height="28" rx="5" fill="#170B26" stroke="url(#metalGold)" stroke-width="2.5"/>
    <circle cx="210" cy="249" r="3" fill="#D4B475"/>
  </g>

  <!-- 2. ÓCULOS DE SOL CLÁSSICO ARMAÇÃO DOURADA -->
  <g filter="url(#acessShadow)" transform="translate(545, 225) scale(0.9)">
    <rect x="0" y="0" width="65" height="42" rx="12" fill="#170B26" stroke="url(#metalGold)" stroke-width="2.5"/>
    <line x1="10" y1="8" x2="34" y2="32" stroke="#FAF8F5" stroke-width="1.2" stroke-opacity="0.35"/>
    <path d="M 65,15 Q 75,10 85,15" stroke="url(#metalGold)" stroke-width="2.8" fill="none"/>
    <rect x="85" y="0" width="65" height="42" rx="12" fill="#170B26" stroke="url(#metalGold)" stroke-width="2.5"/>
    <line x1="95" y1="8" x2="119" y2="32" stroke="#FAF8F5" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <text x="760" y="375" font-family="'Bodoni Moda', Georgia, serif" font-size="20" font-weight="600" fill="rgba(250, 248, 245, 0.2)" letter-spacing="6" text-anchor="end">ACESSÓRIOS</text>
</svg>
