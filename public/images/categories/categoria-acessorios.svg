<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none">
  <defs>
    <radialGradient id="catAcessBg" cx="70%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#260C4C"/>
      <stop offset="50%" stop-color="#120424"/>
      <stop offset="100%" stop-color="#07020D"/>
    </radialGradient>
    <linearGradient id="bagLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380C6E"/>
      <stop offset="50%" stop-color="#1E073D"/>
      <stop offset="100%" stop-color="#0E031E"/>
    </linearGradient>
    <linearGradient id="metalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="acessGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="acessShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#catAcessBg)"/>

  <!-- Halo de Luz Ciano & Roxo -->
  <circle cx="620" cy="200" r="180" fill="#7C24E0" fill-opacity="0.16" filter="url(#acessGlow)"/>
  <circle cx="650" cy="180" r="100" fill="#00F0FF" fill-opacity="0.14" filter="url(#acessGlow)"/>

  <!-- Elementos de Fundo Geométricos -->
  <circle cx="680" cy="120" r="90" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <path d="M 720 70 L 723 78 L 731 80 L 723 82 L 720 90 L 717 82 L 709 80 L 717 78 Z" fill="#00F0FF" filter="url(#acessGlow)"/>

  <!-- Sombra de Mesa / Pedestal Editorial -->
  <ellipse cx="600" cy="360" rx="190" ry="22" fill="#000000" fill-opacity="0.9" filter="url(#acessGlow)"/>

  <!-- COMPOSIÇÃO DE ACESSÓRIOS DE LUXO -->
  <!-- 1. BOLSA BAGUETTE DE COURO -->
  <g filter="url(#acessShadow)" transform="translate(380, 40)">
    <!-- Alça em Corrente Articulada Ciano Metálico -->
    <path d="M 120,180 C 120,60 300,60 300,180" stroke="url(#metalCyan)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#acessGlow)"/>
    <path d="M 120,180 C 120,60 300,60 300,180" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6 8" stroke-linecap="round" fill="none"/>

    <!-- Fixadores da Alça -->
    <circle cx="120" cy="185" r="10" fill="#07020D" stroke="url(#metalCyan)" stroke-width="3"/>
    <circle cx="300" cy="185" r="10" fill="#07020D" stroke="url(#metalCyan)" stroke-width="3"/>

    <!-- Corpo da Bolsa Baguette -->
    <path d="M 105,190 C 100,280 130,320 210,320 C 290,320 320,280 315,190 Z" fill="url(#bagLeather)"/>
    <path d="M 112,195 C 108,270 135,310 210,310 C 285,310 312,270 308,195" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="4 4" fill="none" stroke-opacity="0.7"/>

    <!-- Aba Frontal da Bolsa -->
    <path d="M 104,188 C 150,195 270,195 316,188 L 305,250 C 260,270 160,270 115,250 Z" fill="#240A4E" stroke="#3C1569" stroke-width="1.5"/>

    <!-- Fecho Geométrico Monograma VB em Ciano -->
    <rect x="190" y="235" width="40" height="28" rx="6" fill="#07020D" stroke="url(#metalCyan)" stroke-width="2.5" filter="url(#acessGlow)"/>
    <circle cx="210" cy="249" r="3" fill="#00F0FF"/>
  </g>

  <!-- 2. ÓCULOS DE SOL OVERSIZED DESIGNER -->
  <g filter="url(#acessShadow)" transform="translate(620, 220)">
    <!-- Armação Geométrica Ciano e Tartaruga Roxo -->
    <!-- Lente Esquerda -->
    <rect x="0" y="0" width="65" height="42" rx="12" fill="#07020D" stroke="#00F0FF" stroke-width="2.5" filter="url(#acessGlow)"/>
    <line x1="8" y1="8" x2="35" y2="34" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Ponteira Central -->
    <path d="M 65,15 Q 75,10 85,15" stroke="#00F0FF" stroke-width="3" fill="none"/>
    <!-- Lente Direita -->
    <rect x="85" y="0" width="65" height="42" rx="12" fill="#07020D" stroke="#00F0FF" stroke-width="2.5" filter="url(#acessGlow)"/>
    <line x1="93" y1="8" x2="120" y2="34" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Hastes dos Óculos -->
    <path d="M 0,15 L -20,25" stroke="#B77BFA" stroke-width="2"/>
    <path d="M 150,15 L 170,25" stroke="#B77BFA" stroke-width="2"/>
  </g>

  <!-- Assinatura Gráfica -->
  <text x="760" y="375" font-family="'Bodoni Moda', serif" font-size="24" font-weight="700" fill="rgba(255, 255, 255, 0.15)" letter-spacing="6" text-anchor="end">LUXURY ACCESSORIES</text>
</svg>
