<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioPants" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#180A2E" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#0E041A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07020D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="blackVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#230E3E"/>
      <stop offset="50%" stop-color="#140626"/>
      <stop offset="100%" stop-color="#0B0314"/>
    </linearGradient>
    <filter id="pantsShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioPants)"/>

  <!-- Halo de Luz -->
  <circle cx="300" cy="400" r="160" fill="#7C24E0" fill-opacity="0.1"/>

  <!-- Tag Editorial -->
  <g transform="translate(40, 40)">
    <rect width="105" height="26" rx="13" fill="#140626" stroke="#00F0FF" stroke-width="1.2"/>
    <text x="52" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1.5" text-anchor="middle">ESSENTIAL</text>
  </g>

  <!-- CALÇA PANTALONA ALFAIATARIA -->
  <g filter="url(#pantsShadow)">
    <!-- Cabide de Calça com Prendedores Ciano -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="210" y1="140" x2="390" y2="140" stroke="#00F0FF" stroke-width="3"/>
    <rect x="230" y="132" width="16" height="24" rx="3" fill="#07020D" stroke="#00F0FF" stroke-width="1.5"/>
    <rect x="354" y="132" width="16" height="24" rx="3" fill="#07020D" stroke="#00F0FF" stroke-width="1.5"/>

    <!-- Cós Alto com Passantes de Cinto e Botão Ciano -->
    <path d="M 220,150 L 380,150 L 375,195 L 225,195 Z" fill="#2E1054" stroke="#3C1569" stroke-width="1.5"/>
    <line x1="220" y1="152" x2="380" y2="152" stroke="#00F0FF" stroke-width="1.8"/>

    <!-- Passantes de Cinto -->
    <rect x="240" y="148" width="6" height="22" rx="2" fill="#00F0FF"/>
    <rect x="297" y="148" width="6" height="22" rx="2" fill="#00F0FF"/>
    <rect x="354" y="148" width="6" height="22" rx="2" fill="#00F0FF"/>

    <!-- Pernas Pantalona Fluida com Caimento Amplo -->
    <!-- Perna Esquerda -->
    <path d="M 225,195 L 295,240 L 290,620 C 235,625 180,620 160,615 L 220,195 Z" fill="url(#blackVelvet)"/>
    <!-- Perna Direita -->
    <path d="M 375,195 L 305,240 L 310,620 C 365,625 420,620 440,615 L 380,195 Z" fill="url(#blackVelvet)"/>

    <!-- Vinco Frontal Elegante com Brilho Acetinado -->
    <line x1="250" y1="195" x2="225" y2="615" stroke="#7C24E0" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="350" y1="195" x2="375" y2="615" stroke="#7C24E0" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Bolsos Facas Alfaiataria -->
    <line x1="224" y1="195" x2="242" y2="250" stroke="#00F0FF" stroke-width="1.5"/>
    <line x1="376" y1="195" x2="358" y2="250" stroke="#00F0FF" stroke-width="1.5"/>

    <!-- Barra Larga Invisível -->
    <path d="M 160,600 C 200,605 250,605 290,600" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.7"/>
    <path d="M 310,600 C 350,605 400,605 440,600" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>

  <!-- Assinatura Editorial -->
  <text x="300" y="718" font-family="'Bodoni Moda', serif" font-size="16" font-weight="600" fill="#EDE6FA" letter-spacing="4" text-anchor="middle">PANTALONA ALFAIATARIA</text>
</svg>
