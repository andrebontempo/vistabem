<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioPants" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2E1B46" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#1C102B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#130B1E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="blackVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1945"/>
      <stop offset="50%" stop-color="#1D102E"/>
      <stop offset="100%" stop-color="#12091E"/>
    </linearGradient>
    <filter id="pantsShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#09040E" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioPants)"/>
  <circle cx="300" cy="400" r="160" fill="#C5A059" fill-opacity="0.06"/>

  <g transform="translate(40, 40)">
    <rect width="105" height="26" rx="13" fill="#1F1230" stroke="#C5A059" stroke-width="1"/>
    <text x="52" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D4B475" letter-spacing="1.5" text-anchor="middle">ESSENTIAL</text>
  </g>

  <g filter="url(#pantsShadow)">
    <!-- Cabide de Calça com Prendedores Dourado Champanhe -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#D4B475" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <line x1="210" y1="140" x2="390" y2="140" stroke="#C5A059" stroke-width="2.8"/>
    <rect x="230" y="132" width="16" height="24" rx="3" fill="#1F1230" stroke="#D4B475" stroke-width="1.5"/>
    <rect x="354" y="132" width="16" height="24" rx="3" fill="#1F1230" stroke="#D4B475" stroke-width="1.5"/>

    <!-- Cós Alto -->
    <path d="M 220,150 L 380,150 L 375,195 L 225,195 Z" fill="#2A1542" stroke="#4A2570" stroke-width="1.5"/>
    <line x1="220" y1="152" x2="380" y2="152" stroke="#C5A059" stroke-width="1.6"/>

    <!-- Passantes -->
    <rect x="240" y="148" width="6" height="22" rx="2" fill="#C5A059"/>
    <rect x="297" y="148" width="6" height="22" rx="2" fill="#C5A059"/>
    <rect x="354" y="148" width="6" height="22" rx="2" fill="#C5A059"/>

    <!-- Pernas Pantalona -->
    <path d="M 225,195 L 295,240 L 290,620 C 235,625 180,620 160,615 L 220,195 Z" fill="url(#blackVelvet)"/>
    <path d="M 375,195 L 305,240 L 310,620 C 365,625 420,620 440,615 L 380,195 Z" fill="url(#blackVelvet)"/>

    <!-- Vinco Frontal -->
    <line x1="250" y1="195" x2="225" y2="615" stroke="#8C73A8" stroke-width="1.4" stroke-opacity="0.5"/>
    <line x1="350" y1="195" x2="375" y2="615" stroke="#8C73A8" stroke-width="1.4" stroke-opacity="0.5"/>

    <!-- Bolsos Faca -->
    <line x1="224" y1="195" x2="242" y2="250" stroke="#D4B475" stroke-width="1.4"/>
    <line x1="376" y1="195" x2="358" y2="250" stroke="#D4B475" stroke-width="1.4"/>

    <!-- Barra -->
    <path d="M 160,600 C 200,605 250,605 290,600" stroke="#D4B475" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M 310,600 C 350,605 400,605 440,600" stroke="#D4B475" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <text x="300" y="718" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="600" fill="#DFD3EE" letter-spacing="4" text-anchor="middle">PANTALONA ALFAIATARIA</text>
</svg>
