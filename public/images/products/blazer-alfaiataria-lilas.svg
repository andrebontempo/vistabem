<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioBlazer" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2E1B46" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#1C102B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#130B1E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="blazerLilac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6DCF2"/>
      <stop offset="50%" stop-color="#C8B4E3"/>
      <stop offset="100%" stop-color="#9A78C2"/>
    </linearGradient>
    <filter id="blazerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#09040E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioBlazer)"/>
  <circle cx="300" cy="350" r="170" fill="#C5A059" fill-opacity="0.06"/>

  <g transform="translate(40, 40)">
    <rect width="112" height="26" rx="13" fill="#1F1230" stroke="#C5A059" stroke-width="1"/>
    <text x="56" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D4B475" letter-spacing="1.5" text-anchor="middle">ALFAIATARIA</text>
  </g>

  <g filter="url(#blazerShadow)">
    <!-- Cabide Dourado Champanhe -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#D4B475" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 180,165 L 300,122 L 420,165" stroke="#C5A059" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Mangas -->
    <path d="M 180,165 L 140,240 L 160,490 L 210,480 L 215,280" fill="url(#blazerLilac)"/>
    <path d="M 420,165 L 460,240 L 440,490 L 390,480 L 385,280" fill="url(#blazerLilac)"/>

    <line x1="160" y1="475" x2="208" y2="467" stroke="#C5A059" stroke-width="1.8"/>
    <line x1="440" y1="475" x2="392" y2="467" stroke="#C5A059" stroke-width="1.8"/>

    <!-- Corpo do Blazer -->
    <path d="M 205,175 L 205,530 C 240,545 360,545 395,530 L 395,175 Z" fill="url(#blazerLilac)"/>

    <!-- Decote Interno -->
    <polygon points="265,175 300,270 335,175" fill="#1F1230"/>
    <path d="M 275,185 Q 300,220 325,185" stroke="#D4B475" stroke-width="1.5" fill="none"/>
    <circle cx="300" cy="205" r="3" fill="#D4B475"/>

    <!-- Lapelas -->
    <path d="M 225,175 L 245,260 L 215,290 L 275,390 L 300,390 L 270,175 Z" fill="#F2ECF9" stroke="#4A2570" stroke-width="1.5"/>
    <path d="M 375,175 L 355,260 L 385,290 L 300,450 L 285,450 L 330,175 Z" fill="#FAF8F5" stroke="#4A2570" stroke-width="1.5"/>

    <!-- Bolsos -->
    <rect x="220" y="420" width="60" height="8" rx="2" fill="#3B1D5E"/>
    <rect x="320" y="420" width="60" height="8" rx="2" fill="#3B1D5E"/>
    <line x1="220" y1="420" x2="280" y2="420" stroke="#C5A059" stroke-width="1.5"/>
    <line x1="320" y1="420" x2="380" y2="420" stroke="#C5A059" stroke-width="1.5"/>

    <!-- Botões Dourados & Ameixa -->
    <circle cx="310" cy="385" r="6.5" fill="#231236" stroke="#D4B475" stroke-width="2"/>
    <circle cx="310" cy="425" r="6.5" fill="#231236" stroke="#D4B475" stroke-width="2"/>
    <circle cx="310" cy="465" r="6.5" fill="#231236" stroke="#D4B475" stroke-width="2"/>
  </g>

  <text x="300" y="718" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="600" fill="#DFD3EE" letter-spacing="4" text-anchor="middle">ALFAIATARIA VISTA BEM</text>
</svg>
