<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioKids" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#190B2E" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#0E041A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07020D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="kidsLilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="60%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="kidsShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioKids)"/>

  <!-- Halo de Luz Fofo / Kids -->
  <circle cx="300" cy="350" r="160" fill="#D8B4FE" fill-opacity="0.12"/>

  <!-- Tag Editorial Kids -->
  <g transform="translate(40, 40)">
    <rect width="90" height="26" rx="13" fill="#140626" stroke="#00F0FF" stroke-width="1.2"/>
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1.5" text-anchor="middle">KIDS</text>
  </g>

  <!-- CONJUNTO INFANTIL: BLUSINHA + SHORTINHO -->
  <g filter="url(#kidsShadow)">
    <!-- Cabide Infantil Fofo em Ciano -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 210,160 L 300,122 L 390,160" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- 1. BLUSINHA COM BABADO NOS OMBROS -->
    <!-- Mangas com Babado / Fru-fru -->
    <path d="M 210,165 C 190,180 185,210 205,225 C 220,215 225,195 230,175 Z" fill="#F3E8FF"/>
    <path d="M 390,165 C 410,180 415,210 395,225 C 380,215 375,195 370,175 Z" fill="#F3E8FF"/>

    <!-- Corpo da Blusa em Algodão Lilás -->
    <path d="M 225,170 L 220,340 C 260,355 340,355 380,340 L 375,170 Z" fill="url(#kidsLilacGrad)"/>

    <!-- Decote Redondo com Viés Confort -->
    <path d="M 255,170 Q 300,200 345,170" stroke="#FAF5FF" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Estampa Frontal Delicada: Laço com Coração Ciano -->
    <circle cx="300" cy="245" r="30" fill="rgba(255, 255, 255, 0.4)"/>
    <path d="M 290,240 C 275,220 280,260 295,245 Z" fill="#00F0FF"/>
    <path d="M 310,240 C 325,220 320,260 305,245 Z" fill="#00F0FF"/>
    <circle cx="300" cy="245" r="4" fill="#FFFFFF"/>
    <text x="300" y="295" font-family="'Bodoni Moda', serif" font-size="12" font-weight="700" fill="#380C6E" letter-spacing="2" text-anchor="middle">PETIT VISTA</text>

    <!-- Barra com Babadinho -->
    <path d="M 215,338 Q 230,352 245,338 Q 260,352 275,338 Q 290,352 305,338 Q 320,352 335,338 Q 350,352 365,338 Q 380,352 385,338" stroke="#FFFFFF" stroke-width="3" fill="none"/>

    <!-- 2. SHORTINHO COM ELÁSTICO & LAÇO -->
    <!-- Cós com Elástico Macio -->
    <rect x="235" y="380" width="130" height="24" rx="8" fill="#C084FC" stroke="#00F0FF" stroke-width="1.5"/>
    <!-- Laço Ciano no Cós -->
    <path d="M 300,392 L 285,385 L 290,398 Z" fill="#00F0FF"/>
    <path d="M 300,392 L 315,385 L 310,398 Z" fill="#00F0FF"/>
    <circle cx="300" cy="392" r="3" fill="#FFFFFF"/>

    <!-- Perninhas do Short -->
    <path d="M 235,404 L 215,505 C 250,515 275,510 285,470 L 300,430 L 315,470 C 325,510 350,515 385,505 L 365,404 Z" fill="url(#kidsLilacGrad)"/>

    <!-- Dobra da Barra do Shortinho -->
    <rect x="215" y="490" width="65" height="15" rx="3" fill="#E9D5FF"/>
    <rect x="320" y="490" width="65" height="15" rx="3" fill="#E9D5FF"/>
    <line x1="215" y1="492" x2="280" y2="492" stroke="#00F0FF" stroke-width="1.2"/>
    <line x1="320" y1="492" x2="385" y2="492" stroke="#00F0FF" stroke-width="1.2"/>
  </g>

  <!-- Assinatura Editorial -->
  <text x="300" y="718" font-family="'Bodoni Moda', serif" font-size="16" font-weight="600" fill="#EDE6FA" letter-spacing="4" text-anchor="middle">INFANTIL VISTA BEM</text>
</svg>
