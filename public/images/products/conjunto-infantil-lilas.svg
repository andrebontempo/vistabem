<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioKids" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2E1B46" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#1C102B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#130B1E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="kidsLilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2ECF9"/>
      <stop offset="60%" stop-color="#DFD3EE"/>
      <stop offset="100%" stop-color="#B89CE0"/>
    </linearGradient>
    <filter id="kidsShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#09040E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioKids)"/>
  <circle cx="300" cy="350" r="160" fill="#C5A059" fill-opacity="0.06"/>

  <g transform="translate(40, 40)">
    <rect width="90" height="26" rx="13" fill="#1F1230" stroke="#C5A059" stroke-width="1"/>
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D4B475" letter-spacing="1.5" text-anchor="middle">PETIT</text>
  </g>

  <g filter="url(#kidsShadow)">
    <!-- Cabide Infantil em Dourado Champanhe -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#D4B475" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 210,160 L 300,122 L 390,160" stroke="#C5A059" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Mangas com Babado -->
    <path d="M 210,165 C 190,180 185,210 205,225 C 220,215 225,195 230,175 Z" fill="#FAF8F5"/>
    <path d="M 390,165 C 410,180 415,210 395,225 C 380,215 375,195 370,175 Z" fill="#FAF8F5"/>

    <!-- Corpo da Blusa -->
    <path d="M 225,170 L 220,340 C 260,355 340,355 380,340 L 375,170 Z" fill="url(#kidsLilacGrad)"/>

    <path d="M 255,170 Q 300,200 345,170" stroke="#FAF8F5" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Laço Dourado Champanhe -->
    <circle cx="300" cy="245" r="28" fill="rgba(250, 248, 245, 0.45)"/>
    <path d="M 290,240 C 275,220 280,260 295,245 Z" fill="#C5A059"/>
    <path d="M 310,240 C 325,220 320,260 305,245 Z" fill="#C5A059"/>
    <circle cx="300" cy="245" r="3.5" fill="#FAF8F5"/>
    <text x="300" y="295" font-family="'Bodoni Moda', Georgia, serif" font-size="12" font-weight="700" fill="#3B1D5E" letter-spacing="2" text-anchor="middle">PETIT VISTA</text>

    <path d="M 215,338 Q 230,352 245,338 Q 260,352 275,338 Q 290,352 305,338 Q 320,352 335,338 Q 350,352 365,338 Q 380,352 385,338" stroke="#FAF8F5" stroke-width="2.5" fill="none"/>

    <!-- Shortinho -->
    <rect x="235" y="380" width="130" height="24" rx="8" fill="#A688CE" stroke="#C5A059" stroke-width="1.4"/>
    <path d="M 300,392 L 285,385 L 290,398 Z" fill="#C5A059"/>
    <path d="M 300,392 L 315,385 L 310,398 Z" fill="#C5A059"/>
    <circle cx="300" cy="392" r="2.8" fill="#FAF8F5"/>

    <path d="M 235,404 L 215,505 C 250,515 275,510 285,470 L 300,430 L 315,470 C 325,510 350,515 385,505 L 365,404 Z" fill="url(#kidsLilacGrad)"/>

    <rect x="215" y="490" width="65" height="15" rx="3" fill="#F2ECF9"/>
    <rect x="320" y="490" width="65" height="15" rx="3" fill="#F2ECF9"/>
    <line x1="215" y1="492" x2="280" y2="492" stroke="#C5A059" stroke-width="1.2"/>
    <line x1="320" y1="492" x2="385" y2="492" stroke="#C5A059" stroke-width="1.2"/>
  </g>

  <text x="300" y="718" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="600" fill="#DFD3EE" letter-spacing="4" text-anchor="middle">INFANTIL VISTA BEM</text>
</svg>
