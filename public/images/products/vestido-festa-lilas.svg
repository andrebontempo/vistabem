<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioGown" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#311C4A" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#1C102B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#130B1E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silkLilac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2ECF9"/>
      <stop offset="35%" stop-color="#D5C5E8"/>
      <stop offset="70%" stop-color="#8A64B8"/>
      <stop offset="100%" stop-color="#4A2570"/>
    </linearGradient>
    <filter id="gownShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#09040E" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioGown)"/>
  <circle cx="300" cy="380" r="185" fill="#C5A059" fill-opacity="0.06"/>

  <g transform="translate(40, 40)">
    <rect width="105" height="26" rx="13" fill="#1F1230" stroke="#C5A059" stroke-width="1"/>
    <text x="52" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D4B475" letter-spacing="1.5" text-anchor="middle">COUTURE</text>
  </g>

  <g filter="url(#gownShadow)">
    <!-- Cabide de Luxo Dourado Champanhe -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#D4B475" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 210,165 L 300,122 L 390,165" stroke="#C5A059" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Alças Finas em Ouro Champanhe -->
    <line x1="260" y1="145" x2="265" y2="200" stroke="#D4B475" stroke-width="2.2"/>
    <line x1="340" y1="145" x2="335" y2="200" stroke="#D4B475" stroke-width="2.2"/>

    <!-- Decote Degagê -->
    <path d="M 260,195 Q 300,240 340,195 Q 300,260 260,195 Z" fill="#FAF8F5" stroke="#D4B475" stroke-width="1"/>

    <!-- Corpo de Seda -->
    <path d="M 255,200 L 250,290 Q 300,305 350,290 L 345,200 Z" fill="url(#silkLilac)"/>

    <!-- Cintura Alta em Ouro Champanhe -->
    <path d="M 250,290 Q 300,305 350,290" stroke="#C5A059" stroke-width="2.8" fill="none"/>

    <!-- Saia Longa Fluida -->
    <path d="M 250,292 C 240,370 200,520 150,650 C 230,670 370,670 450,650 C 400,520 360,370 350,292 Z" fill="url(#silkLilac)"/>

    <!-- Fenda Lateral Discreta -->
    <path d="M 330,420 L 390,655" stroke="#D4B475" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pregas da Seda -->
    <path d="M 270,300 C 265,390 235,500 210,655" stroke="#FAF8F5" stroke-width="1.6" stroke-opacity="0.65"/>
    <path d="M 295,302 C 295,410 285,520 275,662" stroke="#3B1D5E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 320,300 C 325,400 335,500 345,660" stroke="#FAF8F5" stroke-width="1.6" stroke-opacity="0.65"/>
  </g>

  <text x="300" y="718" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="600" fill="#DFD3EE" letter-spacing="4" text-anchor="middle">ALTA-COSTURA VISTA BEM</text>
</svg>
