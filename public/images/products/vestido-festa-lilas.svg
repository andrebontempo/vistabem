<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioGown" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F0B3D" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#0E041A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07020D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silkLilac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="35%" stop-color="#D8B4FE"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="gownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="gownShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioGown)"/>

  <!-- Aura Glamour Ciano & Lilás -->
  <circle cx="300" cy="380" r="190" fill="#9B4AF8" fill-opacity="0.12" filter="url(#gownGlow)"/>
  <circle cx="300" cy="420" r="110" fill="#00F0FF" fill-opacity="0.08" filter="url(#gownGlow)"/>

  <!-- Tag Editorial Gala -->
  <g transform="translate(40, 40)">
    <rect width="105" height="26" rx="13" fill="#140626" stroke="#00F0FF" stroke-width="1.2"/>
    <text x="52" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1.5" text-anchor="middle">COUTURE</text>
  </g>

  <!-- VESTIDO LONGO DE SEDA -->
  <g filter="url(#gownShadow)">
    <!-- Cabide de Luxo em Ciano -->
    <path d="M 300,95 C 300,80 315,75 315,90 C 315,105 300,108 300,122" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#gownGlow)"/>
    <path d="M 210,165 L 300,122 L 390,165" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Alças Finas Spaguetti em Ciano Brilhante -->
    <line x1="260" y1="145" x2="265" y2="200" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="340" y1="145" x2="335" y2="200" stroke="#00F0FF" stroke-width="2.5"/>

    <!-- Decote Degagê Fluido (Cowl Neck) -->
    <path d="M 260,195 Q 300,240 340,195 Q 300,260 260,195 Z" fill="#FAF5FF" stroke="#00F0FF" stroke-width="1"/>

    <!-- Corpo / Corpetinho de Seda Acetinada -->
    <path d="M 255,200 L 250,290 Q 300,305 350,290 L 345,200 Z" fill="url(#silkLilac)"/>

    <!-- Cintura Alta / Ponto de Luz em Ciano Neon -->
    <path d="M 250,290 Q 300,305 350,290" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#gownGlow)"/>

    <!-- Saia Longa Sereia com Cauda Fluida -->
    <path d="M 250,292 C 240,370 200,520 150,650 C 230,670 370,670 450,650 C 400,520 360,370 350,292 Z" fill="url(#silkLilac)"/>

    <!-- Fenda Profunda Ousada com Brilho Ciano no Forro Interno -->
    <path d="M 330,420 L 390,655" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#gownGlow)"/>
    <polygon points="330,420 390,655 365,658" fill="rgba(0, 240, 255, 0.25)"/>

    <!-- Ondulações e Pregas da Seda -->
    <path d="M 270,300 C 265,390 235,500 210,655" stroke="#EDE6FA" stroke-width="1.8" stroke-opacity="0.7"/>
    <path d="M 295,302 C 295,410 285,520 275,662" stroke="#6B21A8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 320,300 C 325,400 335,500 345,660" stroke="#EDE6FA" stroke-width="1.8" stroke-opacity="0.7"/>
  </g>

  <!-- Assinatura Editorial -->
  <text x="300" y="718" font-family="'Bodoni Moda', serif" font-size="16" font-weight="600" fill="#EDE6FA" letter-spacing="4" text-anchor="middle">ALTA-COSTURA VISTA BEM</text>
</svg>
