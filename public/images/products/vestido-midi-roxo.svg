<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioLight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D1945" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#1C102B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#130B1E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="dressGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#68389A"/>
      <stop offset="45%" stop-color="#4A2570"/>
      <stop offset="100%" stop-color="#28133E"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#09040E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#studioLight)"/>
  <circle cx="300" cy="360" r="175" fill="#C5A059" fill-opacity="0.06"/>
  <ellipse cx="300" cy="685" rx="170" ry="20" fill="#09040E" fill-opacity="0.55"/>

  <!-- Tag Editorial Sóbria -->
  <g transform="translate(40, 40)">
    <rect width="94" height="26" rx="13" fill="#1F1230" stroke="#C5A059" stroke-width="1"/>
    <text x="47" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D4B475" letter-spacing="1.5" text-anchor="middle">ATELIER</text>
  </g>

  <!-- MANEQUIM & VESTIDO MIDI ELEGANTE -->
  <g filter="url(#dropShadow)">
    <path d="M 285,130 L 285,160 C 265,165 235,178 215,195 L 225,235 C 240,225 260,215 275,212 L 275,250 L 325,250 L 325,212 C 340,215 360,225 375,235 L 385,195 C 365,178 335,165 315,160 L 315,130 Z" fill="#341B50"/>

    <!-- Cabide em Latão Dourado Champanhe -->
    <path d="M 300,105 C 300,90 315,85 315,100 C 315,115 300,118 300,132" stroke="#D4B475" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 205,170 L 300,132 L 395,170" stroke="#C5A059" stroke-width="2.8" stroke-linecap="round" fill="none"/>

    <!-- Busto -->
    <path d="M 235,195 Q 300,225 365,195 L 355,270 Q 300,285 245,270 Z" fill="url(#dressGrad)"/>
    
    <!-- Cintura -->
    <path d="M 245,270 Q 300,285 355,270 L 360,335 Q 300,345 240,335 Z" fill="#3B1C59"/>

    <!-- Cinto Fino com Fivela Dourada -->
    <path d="M 240,332 Q 300,344 360,332" stroke="#C5A059" stroke-width="4" stroke-linecap="round"/>
    <rect x="290" y="328" width="20" height="12" rx="3" fill="#1F1230" stroke="#D4B475" stroke-width="2"/>
    <circle cx="300" cy="334" r="2" fill="#D4B475"/>

    <!-- Saia Midi Evasê -->
    <path d="M 240,336 C 235,420 205,530 185,630 C 235,650 365,650 415,630 C 395,530 365,420 360,336 Z" fill="url(#dressGrad)"/>

    <!-- Linhas de Caimento -->
    <path d="M 255,340 C 250,420 230,520 220,635" stroke="#231036" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 285,343 C 285,430 280,530 275,642" stroke="#B89CE0" stroke-width="1.5" stroke-opacity="0.45"/>
    <path d="M 315,343 C 318,430 325,530 330,642" stroke="#231036" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 345,340 C 352,420 370,520 380,635" stroke="#B89CE0" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- Fenda Lateral Discreta -->
    <path d="M 340,490 L 375,635" stroke="#D4B475" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="300" y="718" font-family="'Bodoni Moda', Georgia, serif" font-size="15" font-weight="600" fill="#DFD3EE" letter-spacing="4" text-anchor="middle">VISTA BEM ATELIER</text>
</svg>
