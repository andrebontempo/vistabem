<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750" fill="none">
  <defs>
    <radialGradient id="studioLight" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1B0A33" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0E041E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07020D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="dressGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7C24E0"/>
      <stop offset="45%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#240A4E"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Estúdio Fotográfico Dark -->
  <rect width="600" height="750" rx="16" fill="url(#studioLight)"/>
  
  <!-- Aura de Luz de Fundo Neon -->
  <circle cx="300" cy="360" r="180" fill="#7C24E0" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="300" cy="400" r="120" fill="#00F0FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Pedestal / Sombra de Chão -->
  <ellipse cx="300" cy="690" rx="180" ry="24" fill="#000000" fill-opacity="0.75" filter="url(#glow)"/>

  <!-- TAG EDITORIAL VISTA BEM -->
  <g transform="translate(40, 40)">
    <rect width="90" height="26" rx="13" fill="#140626" stroke="#00F0FF" stroke-width="1.2"/>
    <text x="45" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00F0FF" letter-spacing="1.5" text-anchor="middle">NEW IN</text>
  </g>

  <!-- MANEQUIM & VESTIDO MIDI ELEGANTE -->
  <g filter="url(#dropShadow)">
    <!-- Silhueta Pescoço / Ombros Estilizados -->
    <path d="M 285,130 L 285,160 C 265,165 235,178 215,195 L 225,235 C 240,225 260,215 275,212 L 275,250 L 325,250 L 325,212 C 340,215 360,225 375,235 L 385,195 C 365,178 335,165 315,160 L 315,130 Z" fill="#2E1054"/>

    <!-- Cabide de Alta-Costura em Ciano -->
    <path d="M 300,105 C 300,90 315,85 315,100 C 315,115 300,118 300,132" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M 205,170 L 300,132 L 395,170" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- VESTIDO CORPO PRINCIPAL -->
    <!-- Busto com Decote Suave -->
    <path d="M 235,195 Q 300,225 365,195 L 355,270 Q 300,285 245,270 Z" fill="url(#dressGrad)"/>
    
    <!-- Cintura Definida -->
    <path d="M 245,270 Q 300,285 355,270 L 360,335 Q 300,345 240,335 Z" fill="#380C6E"/>

    <!-- Cinto Fino com Fivela Ciano -->
    <path d="M 240,332 Q 300,344 360,332" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
    <rect x="290" y="328" width="20" height="12" rx="3" fill="#140626" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="300" cy="334" r="2" fill="#00F0FF"/>

    <!-- Saia Midi Evasê com Pregas Fluidas -->
    <path d="M 240,336 C 235,420 205,530 185,630 C 235,650 365,650 415,630 C 395,530 365,420 360,336 Z" fill="url(#dressGrad)"/>

    <!-- Linhas de Dobra / Caimento Fluido -->
    <path d="M 255,340 C 250,420 230,520 220,635" stroke="#240A4E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 285,343 C 285,430 280,530 275,642" stroke="#9B4AF8" stroke-width="1.8" stroke-opacity="0.6"/>
    <path d="M 315,343 C 318,430 325,530 330,642" stroke="#240A4E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 345,340 C 352,420 370,520 380,635" stroke="#9B4AF8" stroke-width="1.8" stroke-opacity="0.6"/>

    <!-- Fenda Lateral Elegante com Brilho Ciano no Forro -->
    <path d="M 340,490 L 375,635" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="340,490 375,635 358,638" fill="rgba(0, 240, 255, 0.15)"/>
  </g>

  <!-- Assinatura da Peça no Rodapé -->
  <text x="300" y="718" font-family="'Bodoni Moda', serif" font-size="16" font-weight="600" fill="#EDE6FA" letter-spacing="4" text-anchor="middle">VISTA BEM ATELIER</text>
</svg>
