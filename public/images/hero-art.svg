<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" width="500" height="540" fill="none">
  <defs>
    <linearGradient id="editorialArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1646"/>
      <stop offset="60%" stop-color="#1F1030"/>
      <stop offset="100%" stop-color="#170C24"/>
    </linearGradient>
    <linearGradient id="coatPlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2570"/>
      <stop offset="100%" stop-color="#28133D"/>
    </linearGradient>
    <linearGradient id="coatIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EAE4F2"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C792"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B3B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#12081C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Moldura Editorial em Arco Clássico (Atelier Haute Couture) -->
  <g filter="url(#cardShadow)">
    <path d="M 70,230 C 70,110 150,30 250,30 C 350,30 430,110 430,230 L 430,490 C 430,506 417,518 402,518 L 98,518 C 83,518 70,506 70,490 Z" fill="url(#editorialArch)"/>
    <path d="M 82,232 C 82,118 157,42 250,42 C 343,42 418,118 418,232 L 418,484 C 418,496 408,506 396,506 L 104,506 C 92,506 82,496 82,484 Z" stroke="url(#goldAccent)" stroke-width="1.2" stroke-opacity="0.55" fill="none"/>
  </g>

  <!-- Círculo Sutil de Luz Quente no Fundo do Estúdio -->
  <circle cx="250" cy="240" r="145" fill="#C5A059" fill-opacity="0.07"/>
  <line x1="110" y1="478" x2="390" y2="478" stroke="#C5A059" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Estrelas / Pontos de Luz Clássicos em Dourado Champanhe -->
  <path d="M 380 110 L 382 117 L 389 119 L 382 121 L 380 128 L 378 121 L 371 119 L 378 117 Z" fill="#D4B475" fill-opacity="0.8"/>
  <path d="M 118 145 L 120 150 L 125 152 L 120 154 L 118 159 L 116 154 L 111 152 L 116 150 Z" fill="#DFD3EE" fill-opacity="0.65"/>

  <!-- MODELO 1: Chapéu Clássico, Trench Coat Ameixa & Sacola Marfim -->
  <g id="woman-hat" stroke="#EAE4F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chapéu de Aba Larga -->
    <ellipse cx="182" cy="96" rx="44" ry="11" fill="#1B0D2B" stroke="#D4B475" stroke-width="1.8"/>
    <path d="M 160 94 C 158 72, 202 70, 204 94" fill="#2D1646" stroke="#D4B475" stroke-width="1.5"/>

    <!-- Rosto e Silhueta -->
    <path d="M 176 100 C 166 112, 162 132, 155 142"/>
    <path d="M 186 100 C 192 112, 190 124, 187 134"/>

    <!-- Trench Coat Estruturado -->
    <path d="M 166 138 L 146 186 L 136 338 L 224 338 L 214 202 L 198 138 Z" fill="url(#coatPlum)" stroke="#C5A059" stroke-width="1.6"/>
    <!-- Lapela do Casaco em Dourado Champanhe -->
    <path d="M 177 142 L 164 194 L 186 236 L 188 338" stroke="#D4B475" stroke-width="1.6"/>
    <path d="M 190 142 L 200 190 L 186 236" stroke="#DFD3EE" stroke-width="1.5"/>
    <!-- Cinto Acinturado -->
    <path d="M 143 242 L 217 242" stroke="#D4B475" stroke-width="3"/>
    <rect x="175" y="237" width="12" height="10" rx="2" fill="#1F1030" stroke="#D4B475" stroke-width="1.5"/>

    <!-- Braço Direito segurando a Sacola -->
    <path d="M 152 162 L 130 228 L 134 268"/>
    <!-- Alça da Sacola -->
    <path d="M 124 268 C 124 250, 142 250, 142 268" stroke="#D4B475" stroke-width="2.2"/>
    <!-- Sacola Boutique Vista Bem (Marfim & Champanhe) -->
    <rect x="102" y="268" width="80" height="94" rx="5" fill="#FAF8F5" stroke="#C5A059" stroke-width="1.8"/>
    <text x="142" y="310" font-family="'Bodoni Moda', Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#231236" text-anchor="middle" stroke="none">VISTA</text>
    <text x="142" y="326" font-family="'Bodoni Moda', Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9E7B3B" text-anchor="middle" stroke="none">BEM</text>

    <!-- Calça de Alfaiataria & Scarpin Dourado Champanhe -->
    <path d="M 165 338 L 148 452 L 162 452 L 184 338" stroke="#DFD3EE"/>
    <path d="M 188 338 L 212 452 L 226 452 L 206 338" stroke="#DFD3EE"/>

    <path d="M 148 452 L 143 470 L 153 478 L 166 476 L 162 460 Z" fill="#C5A059" stroke="none"/>
    <path d="M 143 470 L 141 484" stroke="#C5A059" stroke-width="2.5"/>
    <path d="M 212 452 L 207 470 L 217 478 L 230 476 L 226 460 Z" fill="#C5A059" stroke="none"/>
    <path d="M 207 470 L 205 484" stroke="#C5A059" stroke-width="2.5"/>
  </g>

  <!-- MODELO 2: Blazer Alfaiataria Marfim, Vestido Ameixa & Sacola Escura -->
  <g id="woman-hair" stroke="#EAE4F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cabelos Ondulados -->
    <path d="M 322 94 C 332 80, 355 85, 355 104 C 355 118, 364 132, 358 156 C 352 170, 340 184, 332 188" fill="#371C54" stroke="#D4B475" stroke-width="1.6"/>
    <path d="M 322 94 C 312 108, 310 122, 318 136"/>
    <path d="M 336 104 C 342 114, 340 124, 333 130"/>

    <!-- Vestido Midi Interno -->
    <path d="M 306 196 L 310 364 L 360 364 L 346 196" fill="#3B1D5E" stroke="#B8A5D1" stroke-width="1.5"/>

    <!-- Blazer Alfaiataria Off-White / Marfim -->
    <path d="M 312 144 L 288 196 L 278 338 L 366 338 L 356 200 L 336 144 Z" fill="url(#coatIvory)" stroke="#C5A059" stroke-width="1.8"/>
    <!-- Lapela do Blazer -->
    <path d="M 320 148 L 308 200 L 326 242 L 326 338" stroke="#9E7B3B" stroke-width="1.6"/>
    <path d="M 332 148 L 342 200 L 326 242" stroke="#9E7B3B" stroke-width="1.6"/>

    <!-- Braço Direito segurando Sacola -->
    <path d="M 296 168 L 272 232 L 276 278" stroke="#2D1646" stroke-width="2.2"/>
    <!-- Alça da Sacola -->
    <path d="M 267 278 C 267 260, 285 260, 285 278" stroke="#D4B475" stroke-width="2.2"/>
    <!-- Sacola Boutique Vista Bem (Ameixa & Ouro) -->
    <rect x="245" y="278" width="80" height="94" rx="5" fill="#231236" stroke="#D4B475" stroke-width="1.8"/>
    <text x="285" y="320" font-family="'Bodoni Moda', Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FAF8F5" text-anchor="middle" stroke="none">VISTA</text>
    <text x="285" y="336" font-family="'Bodoni Moda', Georgia, serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#D4B475" text-anchor="middle" stroke="none">BEM</text>

    <!-- Pernas e Scarpin -->
    <path d="M 316 364 L 302 456 L 316 456 L 334 364"/>
    <path d="M 340 364 L 358 456 L 372 456 L 354 364"/>

    <path d="M 302 456 L 297 474 L 307 482 L 320 480 L 316 464 Z" fill="#D4B475" stroke="none"/>
    <path d="M 297 474 L 295 488" stroke="#D4B475" stroke-width="2.5"/>
    <path d="M 358 456 L 353 474 L 363 482 L 376 480 L 372 464 Z" fill="#D4B475" stroke="none"/>
    <path d="M 353 474 L 351 488" stroke="#D4B475" stroke-width="2.5"/>
  </g>
</svg>
