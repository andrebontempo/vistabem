<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550" fill="none">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140626" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#07020D" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cyanNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com formas orgânicas modernas no tema escuro profundo -->
  <circle cx="250" cy="270" r="220" fill="url(#heroBgGrad)"/>
  <circle cx="360" cy="140" r="70" fill="#00F0FF" fill-opacity="0.12" filter="url(#softGlowCyan)"/>
  <circle cx="120" cy="380" r="90" fill="#7C24E0" fill-opacity="0.18"/>

  <!-- Estrelinhas fashion / sparkles em ciano neon e lilás -->
  <path d="M 420 90 L 423 98 L 431 101 L 423 104 L 420 112 L 417 104 L 409 101 L 417 98 Z" fill="#00F0FF" filter="url(#softGlowCyan)"/>
  <path d="M 90 140 L 92 146 L 98 148 L 92 150 L 90 156 L 88 150 L 82 148 L 88 146 Z" fill="#D8B4FE"/>
  <path d="M 430 380 L 432 385 L 437 387 L 432 389 L 430 394 L 428 389 L 423 387 L 428 385 Z" fill="#00F0FF"/>

  <!-- GRUPO: MODELO 1 (Chapéu Elegante, Casaco Alfaiataria e Sacola) -->
  <g id="woman-hat" stroke="#D8B4FE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chapéu Elegante -->
    <ellipse cx="175" cy="85" rx="48" ry="12" fill="#1E073D" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 152 83 C 150 60, 195 58, 198 83" fill="#240C40"/>

    <!-- Rosto e Silhueta -->
    <path d="M 170 88 C 160 100, 155 125, 148 135"/>
    <path d="M 180 88 C 187 102, 185 115, 182 125"/>
    <path d="M 183 100 C 187 105, 183 115, 178 120"/>

    <!-- Trench Coat e Corpo -->
    <path d="M 160 130 L 140 180 L 128 340 L 220 340 L 210 200 L 195 130 Z" fill="#0F051D" stroke="#B77BFA" stroke-width="2"/>
    <!-- Lapela do Casaco com detalhes em Ciano -->
    <path d="M 172 135 L 158 190 L 182 235 L 185 340" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 185 135 L 196 185 L 182 235"/>
    <path d="M 170 170 L 184 170" stroke="#00F0FF"/>

    <!-- Braço Esquerdo segurando Copo -->
    <path d="M 195 145 L 225 185 L 215 205"/>
    <!-- Copo To-Go -->
    <path d="M 218 175 L 230 175 L 227 200 L 217 200 Z" fill="#1E073D" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 215 174 L 233 174" stroke="#00F0FF" stroke-width="2.5"/>

    <!-- Braço Direito segurando a Sacola -->
    <path d="M 145 155 L 120 225 L 125 270"/>
    <!-- Alça da Sacola -->
    <path d="M 116 270 C 116 250, 134 250, 134 270" stroke="#00F0FF" stroke-width="2.5"/>
    <!-- Sacola Vista Bem -->
    <rect x="95" y="270" width="85" height="100" rx="6" fill="#140626" stroke="#00F0FF" stroke-width="2"/>
    <text x="137" y="315" font-family="'Bodoni Moda', serif" font-size="12" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="middle" stroke="none">VISTA</text>
    <text x="137" y="332" font-family="'Bodoni Moda', serif" font-size="12" font-weight="800" letter-spacing="1" fill="#00F0FF" text-anchor="middle" stroke="none">BEM</text>

    <!-- Calça de Alfaiataria -->
    <path d="M 160 340 L 140 460 L 155 460 L 180 340"/>
    <path d="M 185 340 L 210 460 L 225 460 L 205 340"/>

    <!-- Sapatos de Salto Fino -->
    <path d="M 140 460 L 135 480 L 145 490 L 160 488 L 155 470 Z" fill="#00F0FF" stroke="none"/>
    <path d="M 135 480 L 132 498" stroke="#00F0FF" stroke-width="3"/>
    <path d="M 210 460 L 205 480 L 215 490 L 230 488 L 225 470 Z" fill="#00F0FF" stroke="none"/>
    <path d="M 205 480 L 202 498" stroke="#00F0FF" stroke-width="3"/>
  </g>

  <!-- GRUPO: MODELO 2 (Blazer Contemporâneo, Vestido & Sacola) -->
  <g id="woman-hair" stroke="#EDE6FA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cabelos Ondulados Longos com reflexos Lilás -->
    <path d="M 330 85 C 340 70, 365 75, 365 95 C 365 110, 375 125, 368 150 C 362 165, 348 180, 340 185" fill="#240C40"/>
    <path d="M 330 85 C 320 100, 318 115, 325 130"/>
    <!-- Perfil do Rosto -->
    <path d="M 345 95 C 352 105, 350 115, 342 122"/>

    <!-- Blazer Aberto Alta-Costura -->
    <path d="M 320 135 L 295 190 L 285 340 L 375 340 L 365 195 L 345 135 Z" fill="#140626" stroke="#7C24E0" stroke-width="2"/>
    <!-- Lapela com destaque Ciano -->
    <path d="M 328 140 L 315 195 L 335 240 L 335 340" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 340 140 L 350 195 L 335 240"/>

    <!-- Vestido Midi por baixo -->
    <path d="M 315 195 L 320 370 L 370 370 L 355 195" fill="#1E073D"/>

    <!-- Braço Esquerdo -->
    <path d="M 355 150 L 388 190 L 380 210"/>
    <path d="M 380 180 L 393 180 L 390 205 L 379 205 Z" fill="#1E073D" stroke="#00F0FF" stroke-width="2"/>
    <path d="M 377 179 L 396 179" stroke="#00F0FF" stroke-width="2.5"/>

    <!-- Braço Direito segurando Sacola -->
    <path d="M 305 160 L 278 230 L 282 280"/>
    <!-- Alça da Sacola -->
    <path d="M 273 280 C 273 260, 292 260, 292 280" stroke="#00F0FF" stroke-width="2.5"/>
    <!-- Sacola Vista Bem -->
    <rect x="250" y="280" width="85" height="100" rx="6" fill="#0F051D" stroke="#00F0FF" stroke-width="2"/>
    <text x="292" y="325" font-family="'Bodoni Moda', serif" font-size="12" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="middle" stroke="none">VISTA</text>
    <text x="292" y="342" font-family="'Bodoni Moda', serif" font-size="12" font-weight="800" letter-spacing="1" fill="#00F0FF" text-anchor="middle" stroke="none">BEM</text>

    <!-- Pernas e Salto Fino -->
    <path d="M 325 370 L 310 470 L 325 470 L 345 370"/>
    <path d="M 350 370 L 370 470 L 385 470 L 365 370"/>

    <path d="M 310 470 L 305 490 L 315 500 L 330 498 L 325 480 Z" fill="#00F0FF" stroke="none"/>
    <path d="M 305 490 L 302 508" stroke="#00F0FF" stroke-width="3"/>
    <path d="M 370 470 L 365 490 L 375 500 L 390 498 L 385 480 Z" fill="#00F0FF" stroke="none"/>
    <path d="M 365 490 L 362 508" stroke="#00F0FF" stroke-width="3"/>
  </g>
</svg>
