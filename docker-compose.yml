services:
  vistabem-mongo:
    image: mongo:7.0
    container_name: vistabem-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      vistabem-network:
        aliases:
          - vistabem-mongo

  app:
    build: .
    container_name: vistabem-app
    restart: unless-stopped
    ports:
      - "3010:80"
    env_file:
      - .env
    environment:
      - PORT=80
      - MONGODB_URI=mongodb://vistabem-mongo:27017/vistabem
      - NODE_ENV=production
    volumes:
      - uploads_data:/usr/src/app/public/uploads
    depends_on:
      - vistabem-mongo
    networks:
      - vistabem-network
      proxy:
        aliases:
          - vistabem-app
          - vistabem
          - vistabem_nginx

volumes:
  mongo_data:
  uploads_data:

networks:
  vistabem-network:
    driver: bridge
  proxy:
    external: true

