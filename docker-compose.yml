services:
  db:
    image: mariadb:11.3
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - proxy

  wordpress:
    image: wordpress:php8.2-fpm
    container_name: ${WORDPRESS_CONTAINER_NAME}
    depends_on:
      - db
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${MYSQL_CONTAINER_NAME}:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - ./data/wordpress:/var/www/html
      - ./data/wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - proxy

  nginx:
    image: nginx:latest
    container_name: vistabem_nginx
    depends_on:
      - wordpress
    restart: unless-stopped
#    ports:
#      - "8080:80"
    volumes:
      - ./data/wordpress:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - proxy

networks:
  proxy:
    external: true
